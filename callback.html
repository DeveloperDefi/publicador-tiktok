<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autorizacao recebida</title>
<style>
 :root{--fg:#16161a;--mut:#5b5b66;--bg:#fff;--line:#e6e6ec;--ok:#0a7d3f;--bad:#b3261e}
 @media (prefers-color-scheme:dark){:root:not([data-theme=light]){--fg:#ececf1;--mut:#a0a0ad;--bg:#111114;--line:#2a2a33;--ok:#5ddb96;--bad:#ff8a80}}
 body{background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      max-width:40rem;margin:0 auto;padding:3rem 1rem}
 h1{font-size:1.3rem;margin:0 0 1.5rem}
 code{display:block;background:rgba(127,127,127,.12);border:1px solid var(--line);border-radius:8px;
      padding:1rem;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;margin:.6rem 0}
 button{font:inherit;padding:.6rem 1.1rem;border-radius:8px;border:1px solid var(--line);
        background:transparent;color:inherit;cursor:pointer}
 .ok{color:var(--ok)} .bad{color:var(--bad)} p.sub{color:var(--mut);font-size:.92rem}
</style>
<h1 id="titulo">Lendo a resposta do TikTok...</h1>
<div id="conteudo"></div>
<script>
 const q = new URLSearchParams(location.search);
 const titulo = document.getElementById('titulo');
 const alvo = document.getElementById('conteudo');

 if (q.get('error')) {
   titulo.textContent = 'O TikTok recusou a autorizacao';
   titulo.className = 'bad';
   alvo.innerHTML = '<code>' + (q.get('error') + ' — ' + (q.get('error_description') || ''))
     .replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])) + '</code>';
 } else if (q.get('code')) {
   titulo.textContent = 'Autorizado. Copie a linha abaixo e cole no terminal.';
   titulo.className = 'ok';
   const linha = location.search.slice(1);
   alvo.innerHTML = '<code id="v"></code>'
     + '<button id="b">Copiar</button> '
     + '<p class="sub">Isto NAO e um token: e um codigo de uso unico que expira em minutos '
     + 'e so vale junto com o verificador que ficou no seu computador.</p>';
   document.getElementById('v').textContent = linha;
   document.getElementById('b').onclick = async () => {
     try { await navigator.clipboard.writeText(linha);
           document.getElementById('b').textContent = 'Copiado'; }
     catch (e) { document.getElementById('b').textContent = 'Copie a mao'; }
   };
 } else {
   titulo.textContent = 'Nada para processar';
   alvo.innerHTML = '<p class="sub">Esta pagina so serve como destino do login do TikTok.</p>';
 }
</script>
